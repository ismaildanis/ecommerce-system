services:
  # Laravel API (PHP-FPM)
  php-fpm:
    container_name: laravel-api
    build: 
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: develop,coverage,debug,profile
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www:cached
      - /var/www/vendor
    depends_on:
      postgres:
        condition: service_started
    networks:
      - laravel-development

  # Workspace
  workspace:
    container_name: workspace
    build:
      context: .
      dockerfile: ./docker/development/workspace/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        NODE_VERSION: ${NODE_VERSION:-22}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-true}
        XDEBUG_MODE: ${XDEBUG_MODE:-develop,debug}
        XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
        XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
        XDEBUG_LOG: /dev/stdout
        XDEBUG_LOG_LEVEL: 0
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www:cached
      - /var/www/vendor
    tty: true
    stdin_open: true
    networks:
      - laravel-development
    depends_on:
      - postgres
      - redis
      - rabbitmq

  # Nginx Web Server
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./backend:/var/www
      - ./docker/development/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    networks:
      - laravel-development
    depends_on:
      php-fpm:
        condition: service_started

  # Next.js Frontend
  web:
    build: ./frontend
    container_name: nextjs-app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - php-fpm
    networks:
      - laravel-development

  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - laravel-development

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel-development


  # RabbitMQ Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - laravel-development


  queue:
    container_name: laravel-queue
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        XDEBUG_ENABLED: "false"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      - postgres
      - redis
      - rabbitmq
    command: php artisan queue:work rabbitmq --queue=notifications --verbose --tries=3 --timeout=90
    networks:
      - laravel-development
    

  # Elasticsearch
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - laravel-development


  #kibana:
    #image: docker.elastic.co/kibana/kibana:8.8.0
    #container_name: kibana
    #restart: unless-stopped
    #ports:
      #- "5601:5601"
    #environment:
      #- ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      #- XPACK_SECURITY_ENABLED=false
    #depends_on:
      #- elasticsearch
    #networks:
      #- laravel-development

volumes:
  pgdata:
  redis_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  laravel-development:
    driver: bridge
